<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Sensu Space</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <script>
        // Твої налаштування
        const firebaseConfig = {
            apiKey: "AIzaSyCq9Y0IF9-qPfwBJ18mjaHd-rN_x47_Dhg",
            authDomain: "site-demo-sensu.firebaseapp.com",
            projectId: "site-demo-sensu",
            storageBucket: "site-demo-sensu.firebasestorage.app",
            messagingSenderId: "187954134124",
            appId: "1:187954134124:web:80e9f0aa41a9c3ae7aec49"
        };

        // Запуск
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Функція, щоб відправити пост:
        // Використовуй її в onclick="sendPost()"
        function sendPost(text) {
            db.collection("posts").add({
                text: text,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        // Функція, щоб вивести всі пости на екран:
        // Виклич її один раз, коли сторінка завантажиться
        db.collection("posts").orderBy("timestamp", "desc").onSnapshot(snapshot => {
            snapshot.forEach(doc => {
                console.log("Пост:", doc.data().text);
                // Тут ти додаєш код, який малює пост у твоєму дизайні
            });
        });
    </script>
</body>
</html>
