<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensu Space</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --bg-main: #060609;
            --bg-card: #13131c;
            --bg-input: #0e0e15;
            --border-color: rgba(177, 159, 251, 0.12);
            --border-focus: rgba(177, 159, 251, 0.4);
            --text-main: #e2e8f0;
            --text-muted: #71717a;
            --accent: #b19ffb;
        }

        .light-theme {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --border-color: rgba(177, 159, 251, 0.2);
            --border-focus: rgba(177, 159, 251, 0.6);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #7c3aed;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

        .galaxy-logo {
            background: radial-gradient(circle, #b19ffb 0%, #06b6d4 60%, #050508 100%);
            box-shadow: 0 0 15px rgba(177, 159, 251, 0.3);
        }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col">

    <div id="auth-screen" class="flex-1 flex items-center justify-center p-4">
        <div class="max-w-md w-full p-8 border rounded-2xl bg-[var(--bg-card)] border-[var(--border-color)] shadow-xl">
            <div class="flex flex-col items-center mb-6">
                <div class="w-16 h-16 rounded-full galaxy-logo mb-4 flex items-center justify-center text-xl font-bold text-white">S</div>
                <h2 class="text-2xl font-bold text-purple-400">Вхід до Sensu Space</h2>
                <p class="text-xs text-[var(--text-muted)] mt-1 text-center">Введіть нікнейм. Якщо акаунту немає, його буде створено автоматично.</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold mb-1 text-[var(--text-muted)]">Ваш нікнейм</label>
                    <input id="username-input" type="text" placeholder="Приклад: neo" class="w-full p-3 bg-[var(--bg-input)] rounded-xl border border-[var(--border-color)] focus:border-[var(--accent)] outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1 text-[var(--text-muted)]">Пароль (мін. 6 символів)</label>
                    <input id="password-input" type="password" placeholder="••••••••" class="w-full p-3 bg-[var(--bg-input)] rounded-xl border border-[var(--border-color)] focus:border-[var(--accent)] outline-none text-sm">
                </div>
                <button onclick="handleAuth()" class="w-full bg-purple-600 hover:bg-purple-500 p-3 rounded-xl font-bold text-sm transition mt-2 shadow-lg shadow-purple-600/20 text-white">
                    Увійти / Створити акаунт
                </button>
            </div>
        </div>
    </div>

    <div id="app-screen" class="hidden flex-1 flex flex-col md:flex-row max-w-7xl w-full mx-auto p-4 gap-4">
        
        <aside class="md:w-64 flex flex-col gap-4">
            <div class="p-4 border rounded-2xl bg-[var(--bg-card)] border-[var(--border-color)] flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-purple-600/20 border border-purple-500/30 flex items-center justify-center font-bold text-purple-400" id="user-avatar">?</div>
                    <div>
                        <div class="font-bold text-sm truncate max-w-[120px]" id="user-display-name">Користувач</div>
                        <div class="text-[var(--text-muted)] text-xs">Sensu Citizen</div>
                    </div>
                </div>
                <button onclick="toggleTheme()" class="p-2 rounded-xl bg-[var(--bg-input)] hover:opacity-80 text-xs">🌓</button>
            </div>

            <nav class="p-2 border rounded-2xl bg-[var(--bg-card)] border-[var(--border-color)] flex flex-row md:flex-col gap-1">
                <button onclick="switchTab('feed')" id="tab-btn-feed" class="flex-1 md:flex-initial text-left px-4 py-3 rounded-xl font-medium text-sm bg-purple-600/10 text-purple-400 transition">🪐 Стрічка</button>
                <button onclick="switchTab('chat')" id="tab-btn-chat" class="flex-1 md:flex-initial text-left px-4 py-3 rounded-xl font-medium text-sm text-[var(--text-muted)] hover:bg-[var(--bg-input)] transition">💬 Повідомлення</button>
                <button onclick="logout()" class="hidden md:block text-left px-4 py-3 rounded-xl font-medium text-sm text-red-400 hover:bg-red-500/10 transition mt-auto">🚪 Вийти</button>
            </nav>
            <button onclick="logout()" class="md:hidden w-full px-4 py-3 border border-red-500/20 rounded-xl font-medium text-sm text-red-400 bg-[var(--bg-card)]">🚪 Вийти</button>
        </aside>

        <main class="flex-1 flex flex-col min-h-[500px]">
            
            <div id="tab-feed" class="flex flex-col gap-4 flex-1">
                <div class="p-4 border rounded-2xl bg-[var(--bg-card)] border-[var(--border-color)] flex flex-col gap-3">
                    <textarea id="post-input" placeholder="Що нового у вашому всесвіті?" rows="3" class="w-full p-3 bg-[var(--bg-input)] rounded-xl border border-[var(--border-color)] focus:border-[var(--accent)] outline-none text-sm resize-none"></textarea>
                    <div class="flex justify-end">
                        <button onclick="createPost()" class="bg-purple-600 hover:bg-purple-500 text-white px-5 py-2 rounded-xl font-bold text-sm transition">Опублікувати</button>
                    </div>
                </div>
                <div id="posts-container" class="space-y-4">
                    </div>
            </div>

            <div id="tab-chat" class="hidden flex-1 border rounded-2xl bg-[var(--bg-card)] border-[var(--border-color)] flex flex-col h-[calc(100vh-120px)] md:h-[650px] overflow-hidden">
                <div class="flex flex-1 h-full">
                    <div class="w-1/3 border-r border-[var(--border-color)] flex flex-col">
                        <div class="p-3 border-b border-[var(--border-color)] font-bold text-xs tracking-wider text-[var(--text-muted)] uppercase">Співрозмовники</div>
                        <div id="users-list" class="flex-1 overflow-y-auto p-2 space-y-1">
                            </div>
                    </div>
                    <div id="chat-window" class="w-2/3 flex flex-col bg-[var(--bg-input)]/30">
                        <div id="chat-header" class="p-4 border-b border-[var(--border-color)] font-bold text-sm text-purple-400 bg-[var(--bg-card)]">
                            Оберіть чат для початку спілкування
                        </div>
                        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col">
                            </div>
                        <div id="chat-footer" class="p-3 bg-[var(--bg-card)] border-t border-[var(--border-color)] hidden flex gap-2">
                            <input id="chat-msg-input" type="text" placeholder="Напишіть повідомлення..." class="flex-1 p-2.5 bg-[var(--bg-input)] rounded-xl border border-[var(--border-color)] focus:border-[var(--accent)] outline-none text-sm">
                            <button onclick="sendChatMessage()" class="bg-purple-600 text-white px-4 rounded-xl font-bold hover:bg-purple-500 transition">➤</button>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        // КОНФІГУРАЦІЯ FIREBASE (ЗАМІНІТЬ НА ВЛАСНУ З КОНСОЛІ FIREBASE)
        const firebaseConfig = {
            apiKey: "AIzaSyCq9Y0IF9-qPfwBJ18mjaHd-rN_x47_Dhg",
            authDomain: "site-demo-sensu.firebaseapp.com",
            projectId: "site-demo-sensu",
            storageBucket: "site-demo-sensu.firebasestorage.app",
            messagingSenderId: "187954134124",
            appId: "1:187954134124:web:80e9f0aa41a9c3ae7aec49"
        };

        // Ініціалізація
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let currentActiveChatUser = null;
        let activeTab = 'feed';

        // АВТЕНТИФІКАЦІЯ
        function handleAuth() {
            const username = document.getElementById('username-input').value.trim();
            const pass = document.getElementById('password-input').value;
            
            if (!username || pass.length < 6) {
                alert("Будь ласка, введіть коректний нікнейм та пароль (мінімум 6 символів).");
                return;
            }

            const email = username.toLowerCase() + "@sensu.chat";

            // Спроба реєстрації, якщо користувач новий. Якщо існує — вхід.
            auth.createUserWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    // Зберігаємо нікнейм користувача у системну колекцію для списку чатів
                    db.collection("users").doc(username.toLowerCase()).set({
                        username: username.toLowerCase(),
                        lastActive: firebase.firestore.FieldValue.serverTimestamp()
                    });
                })
                .catch(() => auth.signInWithEmailAndPassword(email, pass))
                .catch(err => alert("Помилка авторизації: " + err.message));
        }

        function logout() {
            auth.signOut();
        }

        // Стеження за станом сесії
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user.email.split('@')[0];
                document.getElementById('user-display-name').innerText = currentUser;
                document.getElementById('user-avatar').innerText = currentUser.substring(0, 2).toUpperCase();
                
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                
                // Оновлення статусу в базі
                db.collection("users").doc(currentUser).set({
                    username: currentUser,
                    lastActive: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                initRealtimeSync();
            } else {
                currentUser = null;
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('hidden');
            }
        });

        // НАВІГАЦІЯ МІЖ ВКЛАДКАМИ
        function switchTab(tab) {
            activeTab = tab;
            if (tab === 'feed') {
                document.getElementById('tab-feed').classList.remove('hidden');
                document.getElementById('tab-chat').classList.add('hidden');
                document.getElementById('tab-btn-feed').className = "flex-1 md:flex-initial text-left px-4 py-3 rounded-xl font-medium text-sm bg-purple-600/10 text-purple-400 transition";
                document.getElementById('tab-btn-chat').className = "flex-1 md:flex-initial text-left px-4 py-3 rounded-xl font-medium text-sm text-[var(--text-muted)] hover:bg-[var(--bg-input)] transition";
            } else {
                document.getElementById('tab-feed').classList.add('hidden');
                document.getElementById('tab-chat').classList.remove('hidden');
                document.getElementById('tab-btn-feed').className = "flex-1 md:flex-initial text-left px-4 py-3 rounded-xl font-medium text-sm text-[var(--text-muted)] hover:bg-[var(--bg-input)] transition";
                document.getElementById('tab-btn-chat').className = "flex-1 md:flex-initial text-left px-4 py-3 rounded-xl font-medium text-sm bg-purple-600/10 text-purple-400 transition";
            }
        }

        // СИНХРОНІЗАЦІЯ ДАНИХ (СТРІЧКА, ЧАТИ, КОРИСТУВАЧІ)
        function initRealtimeSync() {
            // 1. Потокова синхронізація постів стрічки
            db.collection("posts").orderBy("createdAt", "desc").onSnapshot(snapshot => {
                const container = document.getElementById('posts-container');
                container.innerHTML = "";
                if(snapshot.empty) {
                    container.innerHTML = `<div class="text-center p-8 text-[var(--text-muted)] text-sm">Тут ще немає постів. Будьте першим!</div>`;
                    return;
                }
                snapshot.forEach(doc => {
                    const post = doc.data();
                    const postId = doc.id;
                    const likedBy = post.likedBy || [];
                    const isLiked = likedBy.includes(currentUser);

                    const card = document.createElement('div');
                    card.className = "p-4 border rounded-2xl bg-[var(--bg-card)] border-[var(--border-color)] flex flex-col gap-2";
                    card.innerHTML = `
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-sm text-purple-400">@${post.author}</span>
                            <span class="text-[var(--text-muted)] text-xs">${post.createdAt ? new Date(post.createdAt.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'зараз'}</span>
                        </div>
                        <p class="text-sm whitespace-pre-wrap">${post.text}</p>
                        <div class="flex items-center gap-4 mt-2 pt-2 border-t border-[var(--border-color)]">
                            <button onclick="toggleLike('${postId}', ${JSON.stringify(likedBy)})" class="text-xs flex items-center gap-1 text-[var(--text-muted)] hover:text-red-400 transition">
                                ${isLiked ? '❤️' : '🤍'} <span>${likedBy.length}</span>
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });

            // 2. Список користувачів для чату
            db.collection("users").limit(50).onSnapshot(snapshot => {
                const list = document.getElementById('users-list');
                list.innerHTML = "";
                snapshot.forEach(doc => {
                    const user = doc.data();
                    if (user.username === currentUser) return; // Себе не показуємо

                    const row = document.createElement('button');
                    row.className = `w-full text-left p-2.5 rounded-xl text-sm flex items-center gap-2 transition ${currentActiveChatUser === user.username ? 'bg-purple-600/10 text-purple-400 font-semibold' : 'hover:bg-[var(--bg-input)]'}`;
                    row.onclick = () => selectChat(user.username);
                    row.innerHTML = `
                        <div class="w-6 h-6 rounded-full bg-purple-500/10 text-[10px] font-bold flex items-center justify-center text-purple-400">${user.username.substring(0,2).toUpperCase()}</div>
                        <span class="truncate">@${user.username}</span>
                    `;
                    list.appendChild(row);
                });
            });
        }

        // ФУНКЦІОНАЛ ПОСТІВ
        function createPost() {
            const input = document.getElementById('post-input');
            const text = input.value.trim();
            if (!text) return;

            db.collection("posts").add({
                author: currentUser,
                text: text,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                likedBy: []
            }).then(() => {
                input.value = "";
            }).catch(err => alert("Помилка публікації: " + err.message));
        }

        function toggleLike(postId, likedBy) {
            const index = likedBy.indexOf(currentUser);
            if (index > -1) {
                likedBy.splice(index, 1); // Прибрати лайк
            } else {
                likedBy.push(currentUser); // Поставити лайк
            }
            db.collection("posts").doc(postId).update({ likedBy: likedBy });
        }

        // ФУНКЦІОНАЛ ЧАТУ
        let chatMessagesListener = null;

        function selectChat(username) {
            currentActiveChatUser = username;
            document.getElementById('chat-header').innerText = `Чат з @${username}`;
            document.getElementById('chat-footer').classList.remove('hidden');
            
            // Перемальовуємо активний вибір у списку
            initRealtimeSync();

            // Відписуємось від попереднього чату, якщо він був відкритий
            if (chatMessagesListener) chatMessagesListener();

            // Завантажуємо повідомлення між currentUser та currentActiveChatUser
            // Сортуємо за часом. Щоб обійти обмеження запитів Firestore без створення складних індексів,
            // завантажуємо останні 100 повідомлень та фільтруємо на клієнті.
            chatMessagesListener = db.collection("messages")
                .orderBy("timestamp", "asc")
                .limitToLast(100)
                .onSnapshot(snapshot => {
                    const container = document.getElementById('chat-messages');
                    container.innerHTML = "";
                    
                    snapshot.forEach(doc => {
                        const msg = doc.data();
                        // Перевірка, чи це повідомлення стосується поточної пари користувачів
                        if ((msg.sender === currentUser && msg.receiver === currentActiveChatUser) || 
                            (msg.sender === currentActiveChatUser && msg.receiver === currentUser)) {
                            
                            const isMine = msg.sender === currentUser;
                            const msgDiv = document.createElement('div');
                            msgDiv.className = `flex w-full ${isMine ? 'justify-end' : 'justify-start'}`;
                            msgDiv.innerHTML = `
                                <div class="max-w-[75%] p-3 rounded-2xl text-sm ${isMine ? 'bg-purple-600 text-white rounded-br-none' : 'bg-[var(--bg-card)] border border-[var(--border-color)] rounded-bl-none'}">
                                    <p class="break-words leading-tight">${msg.text}</p>
                                </div>
                            `;
                            container.appendChild(msgDiv);
                        }
                    });
                    container.scrollTop = container.scrollHeight;
                });
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-msg-input');
            const text = input.value.trim();
            if (!text || !currentActiveChatUser) return;

            db.collection("messages").add({
                sender: currentUser,
                receiver: currentActiveChatUser,
                text: text,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                input.value = "";
            });
        }

        // ЗМІНА ТЕМИ
        function toggleTheme() {
            const isLight = document.documentElement.classList.toggle('light-theme');
            localStorage.setItem('sensu_theme', isLight ? 'light' : 'dark');
        }

        // Перевірка збереженої теми при завантаженні сторінки
        if (localStorage.getItem('sensu_theme') === 'light') {
            document.documentElement.classList.add('light-theme');
        }
    </script>
</body>
</html>
