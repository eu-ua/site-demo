<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensu Space</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --bg-main: #060609;
            --bg-card: rgba(19, 19, 28, 0.75);
            --border-color: rgba(177, 159, 251, 0.15);
        }
        body { background-color: var(--bg-main); color: white; font-family: sans-serif; }
        .custom-card { background-color: var(--bg-card); border: 1px solid var(--border-color); }
    </style>
</head>
<body class="p-4">

    <div class="max-w-md mx-auto">
        <h1 class="text-2xl font-bold mb-4">Sensu Space</h1>
        
        <div class="custom-card p-4 rounded-xl mb-6">
            <textarea id="post-text" class="w-full bg-transparent border-none outline-none text-sm" placeholder="Що нового?"></textarea>
            <button onclick="sendPost()" class="bg-[#b19ffb] text-black px-4 py-2 rounded-lg font-bold mt-2">Опублікувати</button>
        </div>

        <div id="feed" class="space-y-4"></div>
    </div>

    <script>
        // Твоя конфігурація
        const firebaseConfig = {
            apiKey: "AIzaSyCq9Y0IF9-qPfwBJ18mjaHd-rN_x47_Dhg",
            authDomain: "site-demo-sensu.firebaseapp.com",
            projectId: "site-demo-sensu",
            storageBucket: "site-demo-sensu.firebasestorage.app",
            messagingSenderId: "187954134124",
            appId: "1:187954134124:web:80e9f0aa41a9c3ae7aec49",
            measurementId: "G-XL9VK820LD"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Функція відправки поста
        function sendPost() {
            const text = document.getElementById('post-text').value;
            if(!text) return;
            db.collection("posts").add({
                text: text,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            document.getElementById('post-text').value = "";
        }

        // Отримання постів в реальному часі
        db.collection("posts").orderBy("timestamp", "desc").onSnapshot(snapshot => {
            const feed = document.getElementById('feed');
            feed.innerHTML = "";
            snapshot.forEach(doc => {
                const p = doc.data();
                feed.innerHTML += `<div class="custom-card p-4 rounded-xl text-sm">${p.text}</div>`;
            });
        });
    </script>
</body>
</html>
