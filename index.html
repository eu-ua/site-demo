<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Особистий Профіль</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="profile-container">
        
        <div class="banner-container" onclick="document.getElementById('banner-input').click()">
            <img id="profile-banner" src="https://via.placeholder.com/800x250/2c2c35/ffffff?text=Натисніть,+щоб+змінити+банер" alt="Банер">
            <input type="file" id="banner-input" accept="image/*" style="display: none;" onchange="changeImage(event, 'profile-banner')">
        </div>

        <div class="profile-info-card">
            <div class="profile-main-row">
                
                <div class="avatar-container" onclick="document.getElementById('avatar-input').click()">
                    <img id="profile-avatar" src="https://via.placeholder.com/100" alt="Аватар">
                    <input type="file" id="avatar-input" accept="image/*" style="display: none;" onchange="changeImage(event, 'profile-avatar')">
                </div>

                <div class="user-details">
                    <h2 id="profile-nickname" onclick="editNicknameInline()">rgdvred</h2>
                    <p id="profile-bio">музика</p>

                    <div class="stats-row">
                        <span onclick="openModal('followers-modal')"><strong id="count-followers">0</strong> підписників</span>
                        <span onclick="openModal('following-modal')"><strong id="count-following">0</strong> підписок</span>
                        <span><strong id="count-likes">2</strong> лайків</span>
                    </div>
                </div>

                <div class="profile-actions">
                    <button class="btn btn-edit" onclick="toggleEditPanel()">Редагувати</button>
                    <button class="btn btn-logout" onclick="logout()">Вийти</button>
                </div>
            </div>
        </div>

        <div id="edit-panel" class="edit-panel">
            <h3>Редагування профілю</h3>
            <div class="form-group">
                <label>Нікнейм:</label>
                <input type="text" id="edit-nickname-input">
            </div>
            <div class="form-group">
                <label>Про себе:</label>
                <textarea id="edit-bio-input" rows="2"></textarea>
            </div>
            <div class="form-group">
                <label>Посилання на соц. мережу:</label>
                <input type="url" id="edit-social-input" placeholder="https://instagram.com/username">
            </div>
            <button class="btn btn-save" onclick="saveProfileChanges()">Зберегти зміни</button>
        </div>

        <div class="profile-tabs">
            <button class="tab-btn active" onclick="switchTab('publications')">Публикації</button>
            <button class="tab-btn" onclick="switchTab('reposts')">Репости</button>
            <button id="tab-tracks-btn" class="tab-btn" onclick="switchTab('tracks')" style="display: none;">Мої Треки</button>
        </div>

        <div class="tab-content-container">
            <div id="tab-publications" class="tab-panel active">
                <p class="empty-message">Немає особистих публікацій</p>
            </div>
            
            <div id="tab-reposts" class="tab-panel">
                <p class="empty-message">Немає репостів</p>
            </div>

            <div id="tab-tracks" class="tab-panel">
                <div class="upload-track-zone">
                    <button class="btn btn-upload" onclick="document.getElementById('track-input').click()">Завантажити новий трек</button>
                    <input type="file" id="track-input" accept="audio/*" style="display: none;" onchange="uploadTrack(event)">
                </div>
                <div id="tracks-list"></div>
            </div>
        </div>

    </div>

<div id="following-modal" class="modal" onclick="closeModal(event, 'following-modal')">
        <div class="modal-content">
            <span class="close-modal-btn" onclick="document.getElementById('following-modal').style.display='none'">&times;</span>
            <h3>Підписки</h3>
            <ul class="users-list">
                <li><a href="#" onclick="alert('Перехід на профіль користувача artist_x')">@artist_x</a></li>
            </ul>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script src="script.js"></script>
</body>
</html>
